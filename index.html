<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0c0a12">
<title>Snippet – Das Musik-Quiz für deine Spotify-Playlists</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0a12; --panel:#15121e; --panel2:#1d1929; --line:#2b2640; --line2:#3b3456;
  --text:#f4f1fb; --muted:#9a93ad; --pink:#ff3d81; --orange:#ff8a3d; --cyan:#3de0ff; --lime:#c8ff4d;
  --ok:#35d98a; --bad:#ff5a5a; --r:18px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Space Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:
  radial-gradient(1100px 600px at 0% -10%,rgba(255,61,129,.16),transparent 60%),
  radial-gradient(900px 520px at 110% 0%,rgba(61,224,255,.12),transparent 60%),var(--bg);background-attachment:fixed}
a{color:var(--cyan)}
a.btn{color:var(--text);text-decoration:none}
.wrap{max-width:880px;margin:0 auto;padding:20px 16px 90px}
.narrow{max-width:620px}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0}
input{font:inherit;color:var(--text)}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;background:#0b0911;border:1px solid var(--line);padding:3px 7px;border-radius:7px;word-break:break-all}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:22px;letter-spacing:-.03em}
.logo .mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--pink),var(--orange));display:grid;place-items:center;box-shadow:0 6px 24px rgba(255,61,129,.35)}
.logo .mark svg{width:18px;height:18px}
.logo small{font-weight:400;color:var(--muted);font-size:13px;letter-spacing:0}
.top .right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.who{font-size:13px;color:var(--muted)}

/* cards & controls */
.card{background:linear-gradient(180deg,rgba(255,255,255,.025),transparent),var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px}
.card h2{margin:0 0 14px;font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:8px}
.card h2 .n{width:22px;height:22px;border-radius:50%;background:var(--panel2);border:1px solid var(--line2);display:grid;place-items:center;font-size:11px;color:var(--text);letter-spacing:0}
h1{font-size:28px;letter-spacing:-.03em;margin:0 0 8px}
p{line-height:1.5}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--panel2);border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-weight:500;transition:border-color .15s,transform .1s,background .15s;white-space:nowrap}
.btn:hover{border-color:var(--line2)}
.btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(135deg,var(--pink),var(--orange));border:none;color:#fff;font-weight:700;box-shadow:0 8px 28px rgba(255,61,129,.28)}
.btn.ghost{background:transparent}
.btn.big{padding:16px 22px;font-size:18px;width:100%;border-radius:14px}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.field{width:100%;background:#0b0911;border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none}
.field:focus{border-color:var(--pink)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lbl{font-size:13px;color:var(--muted);margin:16px 0 8px}
.lbl:first-child{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);font-size:14px;transition:.15s}
.chip:hover{border-color:var(--line2)}
.chip.on{background:rgba(255,61,129,.14);border-color:var(--pink)}
.chip.dis{opacity:.35}
.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.preset{border:1px solid var(--line);background:var(--panel2);border-radius:14px;padding:12px;text-align:left;transition:.15s}
.preset b{display:block;font-size:15px;margin-bottom:3px}
.preset span{font-size:12px;color:var(--muted);line-height:1.35;display:block}
.preset.on{border-color:var(--pink);background:rgba(255,61,129,.1)}
@media (max-width:560px){.presets{grid-template-columns:1fr}}

/* playlists */
.pl-list{max-height:330px;overflow:auto;display:grid;gap:4px;margin-top:10px;padding-right:4px}
.pl{display:flex;align-items:center;gap:12px;padding:7px;border-radius:12px;border:1px solid transparent;text-align:left;width:100%}
.pl:hover{background:var(--panel2)}
.pl.on{border-color:var(--pink);background:rgba(255,61,129,.09)}
.pl.off{opacity:.38;cursor:default}
.pl.off:hover{background:none}
.pl .img{width:46px;height:46px;border-radius:9px;object-fit:cover;background:var(--panel2);flex:none;display:grid;place-items:center;font-size:20px}
.pl .meta{min-width:0;flex:1}
.pl .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.pl .sub{font-size:12px;color:var(--muted)}
.liked{background:linear-gradient(135deg,#5b3dff,#9e8bff)!important;color:#fff}
details.others{margin-top:8px}
details.others summary{cursor:pointer;color:var(--muted);font-size:13px;padding:6px 2px}

/* devices */
.dev{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);width:100%;text-align:left;margin-bottom:6px}
.dev.on{border-color:var(--pink);background:rgba(255,61,129,.1)}
.dev .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dev .dot.act{background:var(--ok);box-shadow:0 0 10px var(--ok)}
.status{font-size:13px;color:var(--muted);margin-top:10px;display:flex;gap:8px;align-items:center}
.status.ok{color:var(--ok)} .status.err{color:var(--bad)}

/* setup */
ol.steps{padding-left:20px;line-height:1.6;margin:14px 0}
ol.steps li{margin-bottom:12px}
.copy{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.warn{background:rgba(255,138,61,.1);border:1px solid rgba(255,138,61,.4);color:#ffd0b0;padding:10px 12px;border-radius:12px;font-size:14px;margin:12px 0;line-height:1.45}
.err-box{background:rgba(255,90,90,.1);border:1px solid rgba(255,90,90,.4);color:#ffc4c4;padding:10px 12px;border-radius:12px;font-size:14px;margin:12px 0;line-height:1.45}

/* game */
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}
.hud .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-size:14px}
.hud .stat b{font-size:18px;margin-left:4px}
.stage{position:relative;overflow:hidden;text-align:center;padding:26px 18px 22px}
.stage::before{content:"";position:absolute;inset:-40% -20% auto;height:260px;background:radial-gradient(closest-side,rgba(255,61,129,.18),transparent);pointer-events:none}
.ask{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:10px 0 4px;position:relative}
.fx{display:inline-flex;gap:8px;align-items:center;padding:6px 14px;border-radius:999px;font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;position:relative}
.fx-normal{background:rgba(255,255,255,.07);color:var(--text)}
.fx-fast{background:rgba(61,224,255,.14);color:var(--cyan)}
.fx-slow{background:rgba(200,255,77,.13);color:var(--lime)}
.fx-reverse{background:rgba(255,61,129,.16);color:var(--pink)}
.eq{display:flex;gap:5px;justify-content:center;align-items:flex-end;height:64px;margin:22px auto 16px;position:relative}
.eq i{width:7px;border-radius:4px;background:linear-gradient(180deg,var(--pink),var(--orange));height:8px;opacity:.35;transition:height .2s}
.eq.on i{opacity:1;animation:bounce .9s ease-in-out infinite}
.eq.on.fast i{animation-duration:.45s}
.eq.on.slow i{animation-duration:1.8s}
.eq.on.reverse i{animation-direction:reverse}
@keyframes bounce{0%,100%{height:10px}50%{height:var(--h,50px)}}
.prog{height:6px;border-radius:6px;background:var(--panel2);overflow:hidden;max-width:420px;margin:0 auto 18px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--pink));animation:fill linear forwards}
@keyframes fill{to{width:100%}}
.playbtn{width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--orange));display:inline-grid;place-items:center;box-shadow:0 10px 36px rgba(255,61,129,.4);transition:transform .12s}
.playbtn:hover{transform:scale(1.05)}
.playbtn svg{width:30px;height:30px;margin-left:4px}
.playbtn.spin{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.hint{font-size:13px;color:var(--muted);margin-top:10px;min-height:18px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.opts{grid-template-columns:1fr}}
.opt{padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);text-align:left;font-size:16px;font-weight:500;display:flex;gap:12px;align-items:center;transition:.15s;min-height:62px}
.opt:hover:not(:disabled){border-color:var(--pink)}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;border:1px solid var(--line2);display:grid;place-items:center;font-size:12px;color:var(--muted)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:rgba(53,217,138,.14)}
.opt.bad{border-color:var(--bad);background:rgba(255,90,90,.12)}
.opt.dim{opacity:.4}
.opts.covers{grid-template-columns:repeat(4,1fr)}
@media (max-width:620px){.opts.covers{grid-template-columns:1fr 1fr}}
.opt.cov{padding:6px;flex-direction:column;align-items:stretch;min-height:0}
.opt.cov img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block}
.opt.cov .k{position:absolute;margin:8px;background:rgba(0,0,0,.6)}
.opt.cov{position:relative}
.free{display:flex;gap:10px}
.free .field{font-size:17px}
.reveal{display:flex;gap:16px;align-items:center;margin-top:14px;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--panel2)}
.reveal.ok{border-color:rgba(53,217,138,.55)} .reveal.bad{border-color:rgba(255,90,90,.5)}
.reveal img{width:104px;height:104px;border-radius:12px;object-fit:cover;flex:none}
.reveal .v{font-weight:700;font-size:15px;margin-bottom:4px}
.reveal.ok .v{color:var(--ok)} .reveal.bad .v{color:var(--bad)}
.reveal .t{font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.reveal .a{color:var(--text);opacity:.85}
.reveal .al{color:var(--muted);font-size:14px}
.reveal .links{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.pts{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:8px;background:rgba(255,255,255,.08);font-size:13px;color:var(--text)}
@media (max-width:520px){.reveal{flex-direction:column;text-align:center}.reveal .links{justify-content:center}}

/* results & board */
.score-big{font-size:64px;font-weight:700;letter-spacing:-.04em;line-height:1;background:linear-gradient(135deg,var(--pink),var(--orange));-webkit-background-clip:text;background-clip:text;color:transparent}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.kpi b{display:block;font-size:22px}
.kpi span{font-size:12px;color:var(--muted)}
.rounds{display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.rrow{display:flex;gap:10px;align-items:center;padding:6px;border-radius:10px;background:var(--panel2)}
.rrow img{width:40px;height:40px;border-radius:7px;object-fit:cover}
.rrow .m{flex:1;min-width:0}
.rrow .m div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .m .s{font-size:12px;color:var(--muted)}
.rrow .p{font-weight:700;font-size:14px;min-width:54px;text-align:right}
.rrow .p.ok{color:var(--ok)} .rrow .p.bad{color:var(--bad)}
table.board{width:100%;border-collapse:collapse;font-size:14px}
table.board th{text-align:left;color:var(--muted);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.08em;padding:8px 6px;border-bottom:1px solid var(--line)}
table.board td{padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
table.board td.r{font-weight:700;width:38px;color:var(--muted)}
table.board tr.me td{background:rgba(255,61,129,.08)}
table.board .sc{font-weight:700}
.medal{font-size:16px}
.empty{text-align:center;color:var(--muted);padding:30px 10px}

/* misc */
.loading{text-align:center;padding:80px 20px}
.spinner{width:40px;height:40px;border-radius:50%;border:3px solid var(--line2);border-top-color:var(--pink);animation:rot 1s linear infinite;margin:0 auto 18px}
@keyframes rot{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#231e33;border:1px solid var(--line2);padding:12px 16px;border-radius:12px;max-width:min(92vw,520px);font-size:14px;line-height:1.45;opacity:0;pointer-events:none;transition:.25s;z-index:50;box-shadow:0 12px 40px rgba(0,0,0,.5)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.vol{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.vol input{accent-color:var(--pink);width:140px}
.foot{margin-top:28px;font-size:12px;color:var(--muted);text-align:center;line-height:1.6}

/* Mehrspieler */
.mp-cta{margin-top:10px}
.lobby{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:760px){.lobby{grid-template-columns:minmax(0,1fr)}}
.qrcard{text-align:center;padding:24px}
.qr{background:#fff;border-radius:16px;padding:14px;display:inline-block;width:min(100%,300px);aspect-ratio:1}
.qr img{width:100%;height:100%;image-rendering:pixelated;display:block}
.code{font-size:44px;font-weight:700;letter-spacing:.18em;margin:16px 0 4px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.pchips{display:flex;flex-wrap:wrap;gap:8px}
.pchip{padding:8px 12px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:14px;display:inline-flex;gap:6px;align-items:center}
.pchip.done{border-color:var(--ok);background:rgba(53,217,138,.12)}
.pchip.off{opacity:.45}
.mpbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 12px;flex-wrap:wrap}
.timer{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.opt.c0{border-left:6px solid var(--pink)} .opt.c1{border-left:6px solid var(--cyan)} .opt.c2{border-left:6px solid var(--lime)} .opt.c3{border-left:6px solid var(--orange)}
.opt.cov.c0,.opt.cov.c1,.opt.cov.c2,.opt.cov.c3{border-left-width:1px;border-bottom:6px solid}
.opt.cov.c0{border-bottom-color:var(--pink)} .opt.cov.c1{border-bottom-color:var(--cyan)} .opt.cov.c2{border-bottom-color:var(--lime)} .opt.cov.c3{border-bottom-color:var(--orange)}
.opt .cnt{margin-left:auto;font-size:13px;color:var(--muted);font-weight:500}
.opt.cov .cnt{position:absolute;right:8px;top:8px;background:rgba(0,0,0,.65);padding:2px 8px;border-radius:8px;color:#fff}
.tv .ask{font-size:30px}
.count{font-size:76px;font-weight:700;line-height:64px;height:64px;margin:22px auto 16px;background:linear-gradient(135deg,var(--pink),var(--orange));-webkit-background-clip:text;background-clip:text;color:transparent;animation:pop 1s ease-out}
@keyframes pop{0%{transform:scale(1.6);opacity:0}25%{transform:scale(1);opacity:1}}
.standings{display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.srow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--panel2)}
.srow .rk{width:28px;font-weight:700;color:var(--muted)}
.srow .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.srow .gain{font-size:13px;min-width:56px;text-align:right}
.srow .gain.ok{color:var(--ok)} .srow .gain.bad{color:var(--bad)}
.srow .sc{font-weight:700;min-width:60px;text-align:right}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:640px){.two{grid-template-columns:minmax(0,1fr)}}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:10px;margin:18px 0 6px}
.podium .pod{width:31%;max-width:150px;text-align:center}
.podium .blk{border-radius:12px 12px 0 0;background:linear-gradient(180deg,rgba(255,61,129,.35),rgba(255,61,129,.08));display:grid;place-items:center;font-size:26px;font-weight:700}
.podium .pn{font-weight:700;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.podium .ps{font-size:13px;color:var(--muted);margin-bottom:6px}
/* Handy-Ansicht der Mitspieler */
.pl-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.pl-big{font-size:34px;font-weight:700;letter-spacing:-.03em;text-align:center;margin:10px 0}
.pl-center{text-align:center;padding:30px 18px}
.pl-opts{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.pl-opts.covers{grid-template-columns:1fr 1fr}
.pl-opts .opt{min-height:72px;font-size:18px}
.check{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;margin:0 auto 12px;font-size:34px;background:rgba(53,217,138,.15);color:var(--ok)}
.check.bad{background:rgba(255,90,90,.15);color:var(--bad)}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';

/* ================================================================
   Snippet – Musik-Quiz für Spotify
   Einzelne Datei, kein Server nötig. Login per OAuth PKCE.
   ================================================================ */

// ---------- Helpers ----------
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const store = {
  get(k, d) { try { const v = localStorage.getItem('snq_' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('snq_' + k, JSON.stringify(v)); } catch { } },
  del(k) { try { localStorage.removeItem('snq_' + k); } catch { } }
};
function isMobile() {
  return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}
let toastTimer;
function toast(msg, ms = 4200) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), ms);
}
function randStr(n) {
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';
  const v = crypto.getRandomValues(new Uint8Array(n));
  return Array.from(v, x => chars[x % chars.length]).join('');
}
async function pkceChallenge(verifier) {
  const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
  return btoa(String.fromCharCode(...new Uint8Array(d))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

// Text-Normalisierung für Vergleiche
function norm(s) {
  return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/ß/g, 'ss').replace(/&/g, ' and ').replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();
}
function cleanTitle(s) {
  const c = String(s || '')

}

  return wanted.filter(q => n[q] >= 4);
}
function correctLabel(track, q) { return q === 'title' ? track.name : q === 'artist' ? track.artists[0] : track.album; }
function makeOptions(track, q, tracks) {
  const wrong = shuffle(candidates(track, q, tracks)).slice(0, 3).map(o => ({ ...o, ok: false }));
  const right = q === 'cover' ? { label: track.album, cover: track.coverSmall || track.cover, ok: true } : { label: correctLabel(track, q), ok: true };
  return shuffle([...wrong, right]);
}
function modeLabel() {
  const same = (a, b) => a.length === b.length && a.every(x => b.includes(x));
  const p = Object.values(PRESETS).find(p => same(p.q, S.q) && same(p.fx, S.fx));
  return (p ? p.label : 'Eigener Mix') + (S.answer === 'text' ? ' · Freitext' : '');
}
function takeTrack(g, filter) {
  const i = g.pool.findIndex(t => !g.used.has(t.id) && (!filter || filter(t)));
  if (i < 0) return null;
  return g.pool.splice(i, 1)[0];
}

async function prepareRound() {
  const g = G; // Spiel festhalten, falls zwischendurch neu gestartet wird
  let qType = pick(g.q);
  let fx = pick(g.fx);
  let track = null, previewUrl = null;
  if (fx !== 'normal') {
    for (let k = 0; k < 6; k++) {
      const t = takeTrack(g, t => !g.noPreview.has(t.id));
      if (!t) break;
      const url = await Preview.find(t).catch(() => null);
      if (url) { track = t; previewUrl = url; break; }
      g.noPreview.add(t.id); g.pool.push(t);
    }
    if (!track) { fx = 'normal'; g.fxFallbacks++; }
  }
  if (!track) track = takeTrack(g);
  if (!track) return null;
  g.used.add(track.id);
  if (qType !== 'title' && candidates(track, qType, g.tracks).length < 3) qType = 'title';
  let audio = null;
  if (previewUrl) {
    audio = await Preview.load(previewUrl);
    if (audio.type === 'element' && fx === 'reverse') {
      fx = pick(g.fx.filter(f => f === 'fast' || f === 'slow')) || 'fast';
      if (!Preview.noReverseWarned) { Preview.noReverseWarned = true; toast('Rückwärts geht für manche Vorschauen in diesem Browser nicht – dann gibt’s einen anderen Effekt.'); }
    }
  }
  const rate = fx === 'fast' ? rnd(1.7, 2.0) : fx === 'slow' ? rnd(0.55, 0.68) : 1;
  return {
    track, qType, fx, rate, audio,
    posMs: pickPosition(track, g.secs),
    opts: (qType === 'cover' || g.answer === 'mc') ? makeOptions(track, qType, g.tracks) : null,
    plays: 0, answered: false, startedAt: null, pvStart: null
  };
}
function kickPrefetch() {
  if (G.i + 1 < G.rounds && !G.nextP) G.nextP = prepareRound().catch(() => null);
}

function settingsProblem() {
  if (!S.playlist) return 'Wähle zuerst eine Playlist.';
  if (!S.q.length) return 'Wähle mindestens eine Rate-Art.';
  if (!S.fx.length) return 'Wähle mindestens einen Abspiel-Modus.';
  if (S.output === 'connect' && !S.deviceId) return 'Wähle ein Spotify-Gerät aus (oder nimm den Browser-Player).';
  return '';
}
async function startGame(mp = false) {
  Preview.unlock(); Out.activate();
  const plId = S.playlist;
  const problem = settingsProblem();
  if (problem) return toast(problem);
  if (mp && !mpOnline().length) return toast('Es ist noch niemand beigetreten.');
  const pl = plId === 'liked' ? { name: 'Lieblingssongs' } : (state.playlists || []).find(p => p.id === plId) || { name: 'Playlist' };

  if (mp) MP.broadcast({ t: 'starting' });
  state.view = 'loading'; state.loadingText = 'Lade Songs …'; render();
  try {
    if (S.output === 'browser') await Out.initBrowser();
    const tracks = await loadTracks(plId);
    if (tracks.length < 4) throw new Error('Die Playlist braucht mindestens 4 abspielbare Songs.');
    let q = feasibleTypes(tracks, S.q);
    if (!q.length) { q = ['title']; toast('Zu wenige verschiedene Interpreten/Alben – es wird nach Songtiteln gefragt.'); }
    else if (q.length < S.q.length) toast('Einige Rate-Arten wurden weggelassen (zu wenige verschiedene Alben/Interpreten).');
    G = {
      tracks, plName: pl.name, rounds: Math.min(S.rounds, tracks.length), secs: S.secs,
      q, fx: S.fx.slice(), answer: S.answer, pool: shuffle(tracks.slice()), used: new Set(), noPreview: new Set(),
      i: 0, score: 0, streak: 0, bestStreak: 0, correct: 0, log: [], cur: null, nextP: null,
      phase: 'loading', playDur: S.secs, modeLabel: modeLabel() + (mp ? ' · Party' : ''), fxFallbacks: 0, mp
    };
    if (mp) for (const p of MP.players.values()) Object.assign(p, { score: 0, streak: 0, best: 0, correct: 0 });
    state.loadingText = S.fx.some(f => f !== 'normal') ? 'Suche Vorschau-Clips für die Effekte …' : 'Gleich geht’s los …';
    render();
    G.cur = await prepareRound();
    if (!G.cur) throw new Error('Konnte keine Runde vorbereiten.');
    kickPrefetch();
    G.phase = 'ready';
    state.view = 'game'; render();
    if (mp) mpBroadcastRound();
  } catch (e) {
    console.error(e);
    G = null;
    state.view = mp ? 'lobby' : 'home'; render();
    if (mp) MP.broadcast(() => mpLobbyMsg());
    toast(e.message || String(e), 6000);
  }
}

function onSnippetStart(dur) {
  const c = G?.cur; if (!c) return;
  if (!c.startedAt) c.startedAt = performance.now();
  G.playDur = dur;
  G.phase = c.answered ? 'answered' : 'playing';
  if (G.mp) mpOpenRound();
  renderGame();
}
function onSnippetEnd() {
  if (!G?.cur) return;
  if (G.phase === 'playing') { G.phase = 'listened'; renderGame(); }
}
async function playSnippet() {
  const c = G?.cur; if (!c || G.phase === 'starting' || G.phase === 'countdown') return;
  Preview.unlock(); Out.activate();
  if (!c.plays && !c.answered) { // kurzer Countdown vor dem ersten Abspielen der Runde
    const g = G;
    G.phase = 'countdown';
    if (G.mp) MP.broadcast({ t: 'countdown', i: G.i, n: 3 });
    for (let n = 3; n >= 1; n--) {
      G.count = n; renderGame();
      await sleep(1000);
      if (G !== g || g.cur !== c) return;
    }
  }
  c.plays++;
  G.phase = 'starting'; renderGame();
  try {
    if (c.fx === 'normal') await Out.playTrack(c.track, c.posMs, G.secs, onSnippetStart, onSnippetEnd);
    else await Preview.play(c.audio, c, G.secs, onSnippetStart, onSnippetEnd);
  } catch (e) {
    console.error(e);
    toast(e.message || 'Wiedergabe fehlgeschlagen.', 6000);
    if (G?.cur === c) { G.phase = c.answered ? 'answered' : (c.startedAt ? 'listened' : 'ready'); renderGame(); }
  }
}
function checkText(c, text) {
  return c.qType === 'artist' ? c.track.artists.some(a => isMatch(text, a)) : isMatch(text, correctLabel(c.track, c.qType));
}
// Punkte: Basis (Freitext 150, sonst 100) + Tempo-Bonus bis 100 + Effekt-Bonus 25 + Serien-Bonus bis 50
function calcPts(c, elapsed, streak) {
  const base = !c.opts ? 150 : 100;
  const speed = Math.round(100 * Math.max(0, 1 - elapsed / (G.secs + 10)));
  const fxB = c.fx !== 'normal' ? 25 : 0;
  const streakB = Math.min(50, (streak - 1) * 10);
  return base + speed + fxB + streakB;
}
function submitAnswer(idx, text) {
  const c = G?.cur; if (!c || G.mp || c.answered || !c.startedAt) return;
  c.answered = true;
  const elapsed = (performance.now() - c.startedAt) / 1000;
  let ok;
  if (text != null) { c.given = text; ok = checkText(c, text); }
  else { c.pick = idx; ok = !!c.opts[idx]?.ok; }
  let pts = 0;
  if (ok) {
    G.streak++; G.correct++; G.bestStreak = Math.max(G.bestStreak, G.streak);
    pts = calcPts(c, elapsed, G.streak);
  } else G.streak = 0;
  c.ok = ok; c.pts = pts; G.score += pts;
  G.log.push({ name: c.track.name, artist: c.track.artists.join(', '), cover: c.track.coverSmall, ok, pts, q: c.qType, fx: c.fx });
  stopPlayback();
  G.phase = 'answered';
  renderGame();
}
async function nextRound() {
  Preview.unlock(); Out.activate();
  await stopPlayback();
  if (G.i + 1 >= G.rounds) return finishGame();
  const g = G;
  G.i++; G.phase = 'loading'; G.cur = null; renderGame();
  const c = await (G.nextP || prepareRound().catch(() => null));
  if (G !== g) return; // zwischendurch beendet
  G.nextP = null;
  if (!c) return finishGame();
  G.cur = c; G.phase = 'ready';
  kickPrefetch();
  renderGame();
  if (G.mp) mpBroadcastRound();
  playSnippet();
}
function finishGame() {
  stopPlayback();
  if (G.mp) return mpFinish();
  const entry = { id: randStr(10), name: (S.name || 'Anonym').slice(0, 24), score: G.score, correct: G.correct, rounds: G.log.length, mode: G.modeLabel, playlist: G.plName, date: Date.now() };
  const board = store.get('board', []);
  board.push(entry); board.sort((a, b) => b.score - a.score);
  store.set('board', board.slice(0, 300));
  state.lastEntryId = entry.id;
  G.phase = 'over';
  state.view = 'result'; render();
}
function quitGame() {
  stopPlayback();
  const wasMp = G?.mp;
  if (wasMp) clearTimeout(G.cur?.timer);
  G = null;
  if (wasMp) { state.view = 'lobby'; render(); MP.broadcast(() => mpLobbyMsg()); }
  else { state.view = 'home'; render(); }
}

// =================================================================
// ---------- Mehrspieler (Host) ----------
// Handys verbinden sich per WebRTC (PeerJS) direkt mit dem Host-Gerät.
// =================================================================
const PEER_CDNS = ['https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js', 'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js'];
const QR_CDNS = ['https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js', 'https://unpkg.com/qrcode-generator@1.4.4/qrcode.js'];
const PEER_PREFIX = 'snippetquiz-v1-';
const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const makeCode = () => Array.from(crypto.getRandomValues(new Uint8Array(5)), x => CODE_CHARS[x % CODE_CHARS.length]).join('');
const joinUrl = code => REDIRECT_URI + '?join=' + code;

function loadScript(urls, globalName) {
  if (window[globalName]) return Promise.resolve();
  return urls.reduce((p, u) => p.catch(() => new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = u;
    s.onload = () => window[globalName] ? res() : rej(new Error('missing'));
    s.onerror = () => { s.remove(); rej(new Error('load')); };
    document.head.appendChild(s);
  })), Promise.reject(new Error('start')))
    .catch(() => { throw new Error('Eine benötigte Bibliothek konnte nicht geladen werden. Internetverbindung prüfen.'); });
}
function peerErrMsg(err) {
  const t = err?.type;
  if (t === 'browser-incompatible') return 'Dieser Browser unterstützt keine Direktverbindungen (WebRTC).';
  if (t === 'network' || t === 'server-error' || t === 'socket-error' || t === 'socket-closed') return 'Keine Verbindung zum Vermittlungsserver. Internet prüfen und nochmal versuchen.';
  if (t === 'peer-unavailable') return 'Spiel nicht gefunden. Stimmt der Code und ist die Lobby noch offen?';
  return err?.message || 'Verbindungsfehler' + (t ? ' (' + t + ')' : '');
}
async function keepAwake() { try { if (navigator.wakeLock && !keepAwake.lock) { keepAwake.lock = await navigator.wakeLock.request('screen'); keepAwake.lock.addEventListener('release', () => { keepAwake.lock = null; }); } } catch { } }

const MP = {
  peer: null, code: null, status: 'idle', error: '', players: new Map(), conns: new Map(),
  async open() {
    if (this.peer && this.status === 'ready') return;
    this.status = 'connecting'; this.error = '';
    try {
      await loadScript(PEER_CDNS, 'Peer');
      for (let attempt = 0; attempt < 4; attempt++) {
        try { await this._openPeer(makeCode()); return; }
        catch (e) { if (e.type !== 'unavailable-id') throw e; }
      }
      throw new Error('Kein freier Spiel-Code gefunden.');
    } catch (e) { this.status = 'error'; this.error = e.message; throw e; }
  },
  _openPeer(code) {
    return new Promise((res, rej) => {
      const peer = new Peer(PEER_PREFIX + code.toLowerCase(), { debug: 0 });
      let opened = false;
      peer.on('open', () => { opened = true; this.peer = peer; this.code = code; this.status = 'ready'; res(); });
      peer.on('connection', conn => this.onConn(conn));
      peer.on('disconnected', () => { if (this.peer === peer && !peer.destroyed) setTimeout(() => { try { peer.reconnect(); } catch { } }, 1500); });
      peer.on('error', err => {
        if (!opened) { try { peer.destroy(); } catch { } const e = new Error(peerErrMsg(err)); e.type = err.type; rej(e); }
        else console.warn('peer', err.type, err);
      });
    });
  },
  close() {
    for (const c of this.conns.values()) { try { c.send({ t: 'closed' }); } catch { } setTimeout(() => { try { c.close(); } catch { } }, 300); }
    const p = this.peer; setTimeout(() => { try { p?.destroy(); } catch { } }, 400);
    this.peer = null; this.status = 'idle'; this.code = null; this.players.clear(); this.conns.clear();
  },
  onConn(conn) {
    conn.on('data', m => { try { this.onMsg(conn, m); } catch (e) { console.error(e); } });
    conn.on('close', () => {
      for (const [pid, c] of this.conns) if (c === conn) {
        this.conns.delete(pid);
        const p = this.players.get(pid); if (p) p.online = false;
        mpRefresh();
      }
    });
    conn.on('error', () => { });
  },
  send(pid, msg) { const c = this.conns.get(pid); if (c && c.open) { try { c.send(msg); } catch { } } },
  broadcast(m) { for (const pid of this.conns.keys()) { const p = this.players.get(pid); if (p) this.send(pid, typeof m === 'function' ? m(p) : m); } },
  onMsg(conn, m) {
    if (!m || typeof m !== 'object') return;
    if (m.t === 'hello') {
      const pid = String(m.pid || '').slice(0, 40); if (!pid) return;
      const name = String(m.name || '').replace(/\s+/g, ' ').trim().slice(0, 20) || 'Spieler';
      let p = this.players.get(pid);
      if (!p) {
        if (this.players.size >= 40) { try { conn.send({ t: 'full' }); } catch { } return; }
        const taken = new Set([...this.players.values()].map(x => x.name.toLowerCase()));
        let n = name, k = 2; while (taken.has(n.toLowerCase())) n = name + ' ' + (k++);
        p = { pid, name: n, score: 0, streak: 0, best: 0, correct: 0, played: false, online: true };
        this.players.set(pid, p);
      }
      const old = this.conns.get(pid); if (old && old !== conn) { try { old.close(); } catch { } }
      this.conns.set(pid, conn); p.online = true;
      this.send(pid, { t: 'welcome', name: p.name, score: p.score });
      this.send(pid, mpSnapshot(p));
      mpRefresh();
      return;
    }
    let pid = null; for (const [id, c] of this.conns) if (c === conn) pid = id;
    if (!pid) return;
    if (m.t === 'answer') mpAnswer(pid, m);
  }
};

const mpOnline = () => [...MP.players.values()].filter(p => p.online);
const mpRanking = () => [...MP.players.values()].sort((a, b) => b.score - a.score);
function mpRankOf(p) { const r = mpRanking(); return { rank: r.findIndex(x => x.pid === p.pid) + 1, of: r.length }; }
const mpLobbyMsg = () => ({ t: 'lobby', players: mpOnline().map(p => p.name) });
const mpTrackInfo = t => ({ name: t.name, artists: t.artists.join(', '), album: t.album, cover: t.coverSmall || t.cover });
function mpRoundMsg(p) {
  const c = G.cur;
  return {
    t: 'round', i: G.i, rounds: G.rounds, q: c.qType, ask: Q_TYPES[c.qType].ask, label: Q_TYPES[c.qType].label, fx: c.fx,
    opts: c.opts ? c.opts.map(o => ({ label: o.label, cover: o.cover || null })) : null,
    open: !!c.open, left: c.open ? Math.max(0, c.deadline - Date.now()) : null,
    score: p ? p.score : 0, done: !!(p && c.mpAns?.[p.pid]), given: (p && c.mpAns?.[p.pid]?.given) || ''
  };
}
function mpRevealMsg(p) {
  const c = G.cur, a = c.mpAns?.[p.pid];
  return {
    t: 'reveal', i: G.i, last: G.i + 1 >= G.rounds,
    correct: c.opts ? c.opts.findIndex(o => o.ok) : -1,
    track: mpTrackInfo(c.track),
    you: { ok: !!a?.ok, pts: a?.pts || 0, answered: !!a, given: a?.given ?? null, score: p.score, streak: p.streak, ...mpRankOf(p) }
  };
}
function mpOverMsg(p) {
  return { t: 'over', ranking: mpRanking().slice(0, 10).map(x => ({ name: x.name, score: x.score })), you: { ...mpRankOf(p), score: p.score, correct: p.correct, rounds: G.log.length } };
}
function mpSnapshot(p) {
  if (!G?.mp) return mpLobbyMsg();
  if (G.phase === 'over') return mpOverMsg(p);
  const c = G.cur;
  if (!c) return { t: 'starting' };
  return c.answered ? mpRevealMsg(p) : mpRoundMsg(p);
}
function mpRefresh() {
  if (state.view === 'lobby') {
    const el = $('#lobbyPlayers'); if (el) el.innerHTML = lobbyPlayersHtml();
    const b = $('#lobbyStart'); if (b) b.disabled = !mpOnline().length;
    MP.broadcast(() => mpLobbyMsg());
  } else if (state.view === 'game' && G?.mp) {
    const el = $('#mpStatus'); if (el) el.innerHTML = mpChipsHtml();
  }
}
function mpBroadcastRound() {
  const c = G.cur; c.mpAns = {}; c.open = false;
  MP.broadcast(p => mpRoundMsg(p));
  mpRefresh();
}
// Wird aufgerufen, sobald das Snippet wirklich läuft: ab jetzt darf geraten werden
function mpOpenRound() {
  const c = G.cur;
  if (!c || c.mpOpened || c.answered) return;
  c.mpOpened = true; c.open = true;
  const win = (G.secs + 10) * 1000;
  c.deadline = Date.now() + win;
  MP.broadcast({ t: 'open', i: G.i, left: win });
  c.timer = setTimeout(() => { if (G?.cur === c) mpReveal(); }, win + 300);
}
function mpAnswer(pid, m) {
  const c = G?.cur;
  if (!G?.mp || !c || !c.open || c.answered || m.i !== G.i || c.mpAns[pid]) return;
  const p = MP.players.get(pid); if (!p) return;
  const elapsed = (performance.now() - c.startedAt) / 1000;
  let ok, given;
  if (c.opts) {
    const idx = Number(m.idx);
    if (!Number.isInteger(idx) || idx < 0 || idx >= c.opts.length) return;
    ok = !!c.opts[idx].ok; given = c.opts[idx].label;
    c.mpAns[pid] = { idx, ok, elapsed, given };
  } else {
    given = String(m.text || '').trim().slice(0, 80);
    ok = !!given && checkText(c, given);
    c.mpAns[pid] = { ok, elapsed, given };
  }
  p.played = true;
  MP.send(pid, { t: 'got', i: G.i });
  mpRefresh();
  const online = mpOnline();
  if (online.length && online.every(x => c.mpAns[x.pid])) setTimeout(() => { if (G?.cur === c) mpReveal(); }, 700);
}
function mpReveal() {
  const c = G?.cur; if (!c || c.answered) return;
  clearTimeout(c.timer); c.open = false; c.answered = true;
  let okN = 0;
  for (const p of MP.players.values()) {
    const a = c.mpAns[p.pid];
    if (a?.ok) { p.streak++; p.correct++; p.best = Math.max(p.best, p.streak); a.pts = calcPts(c, a.elapsed, p.streak); p.score += a.pts; okN++; }
    else p.streak = 0;
  }
  G.log.push({ name: c.track.name, artist: c.track.artists.join(', '), cover: c.track.coverSmall, ok: okN > 0, pts: 0, q: c.qType, fx: c.fx, okN, total: Object.keys(c.mpAns).length });
  stopPlayback();
  G.phase = 'answered';
  renderGame();
  MP.broadcast(p => mpRevealMsg(p));
}
function mpFinish() {
  const board = store.get('board', []);
  for (const p of MP.players.values()) {
    if (!p.played) continue;
    board.push({ id: randStr(10), name: p.name, score: p.score, correct: p.correct, rounds: G.log.length, mode: G.modeLabel, playlist: G.plName, date: Date.now() });
  }
  board.sort((a, b) => b.score - a.score);
  store.set('board', board.slice(0, 300));
  state.lastEntryId = null;
  G.phase = 'over';
  state.view = 'result'; render();
  MP.broadcast(p => mpOverMsg(p));
}
function ensureQr() {
  if (!MP.code || state.qrFor === MP.code) return;
  const code = MP.code;
  loadScript(QR_CDNS, 'qrcode').then(() => {
    const q = qrcode(0, 'M'); q.addData(joinUrl(code)); q.make();
    state.qrImg = q.createDataURL(8, 0); state.qrFor = code;
    const b = $('#qrBox'); if (b) b.innerHTML = `<img src="${state.qrImg}" alt="QR-Code zum Beitreten">`;
  }).catch(() => {
    const b = $('#qrBox'); if (b) b.innerHTML = '<div class="small" style="color:#222;padding:30px 10px">QR-Code konnte nicht geladen werden – nutzt den Code darunter.</div>';
  });
}

  return `<div class="wrap">${header(`<button class="btn sm ghost" data-act="closeLobby">Lobby schließen</button>`)}
    <div class="lobby">
      <div class="card qrcard"><h2 style="justify-content:center">Scannen &amp; mitraten</h2>${left}</div>

const PL = {
  peer: null, conn: null, code: '', name: store.get('plname', ''), score: 0,
  // Spieler-ID pro Browser-Tab (übersteht Neuladen, damit Punkte nach Verbindungsabbruch erhalten bleiben)
  pid: (() => { try { let p = sessionStorage.getItem('snq_pid'); if (!p) { p = randStr(14); sessionStorage.setItem('snq_pid', p); } return p; } catch { return randStr(14); } })(),
  st: 'join', err: '', players: [], round: null, reveal: null, over: null, given: '', openUntil: 0, retry: 0, rt: null,
  async connect() {
    try { await loadScript(PEER_CDNS, 'Peer'); }
    catch (e) { this.st = 'join'; this.err = e.message; return renderPlayer(); }
    if (!this.peer || this.peer.destroyed) {
      const peer = new Peer({ debug: 0 }); this.peer = peer;
      try { await new Promise((res, rej) => { peer.once('open', res); peer.once('error', rej); }); }
      catch (e) { this.peer = null; try { peer.destroy(); } catch { } return this.fail(e); }
      peer.on('error', e => { if (['peer-unavailable', 'network', 'server-error', 'socket-error'].includes(e.type)) this.fail(e); });
      peer.on('disconnected', () => { if (!peer.destroyed) setTimeout(() => { try { peer.reconnect(); } catch { } }, 1500); });
    }
    const conn = this.peer.connect(PEER_PREFIX + this.code.toLowerCase(), { reliable: true });
    this.conn = conn;
    const to = setTimeout(() => { if (!conn.open && this.conn === conn) { try { conn.close(); } catch { } this.fail({ type: 'timeout' }); } }, 15000);
    conn.on('open', () => { clearTimeout(to); this.retry = 0; conn.send({ t: 'hello', pid: this.pid, name: this.name }); });
    conn.on('data', m => this.onMsg(m));
    conn.on('close', () => { clearTimeout(to); if (this.conn === conn) this.lost(); });
    conn.on('error', () => { });
  },
  fail(e) {
    if (['lobby', 'starting', 'round', 'answered', 'reveal', 'over', 'lost'].includes(this.st)) return this.lost();
    if (this.st === 'join') return;
    this.st = 'join';
    this.err = e?.type === 'timeout' ? 'Keine Verbindung zum Spiel. Stimmt der Code? Seid ihr im selben WLAN?' : peerErrMsg(e);
    renderPlayer();
  },
  lost() {
    if (this.st === 'join' || this.st === 'connecting') { if (this.st === 'connecting') this.fail({ type: 'timeout' }); return; }
    this.st = 'lost'; renderPlayer();
    clearTimeout(this.rt);
    if (this.retry++ < 15) this.rt = setTimeout(() => { if (this.st === 'lost') this.connect(); }, 2500);
    else { this.st = 'join'; this.err = 'Die Verbindung zum Spiel ist abgebrochen.'; renderPlayer(); }
  },
  onMsg(m) {
    switch (m?.t) {
      case 'welcome': this.name = m.name; this.score = m.score; if (this.st === 'connecting' || this.st === 'lost') this.st = 'lobby'; keepAwake(); break;
      case 'lobby': this.players = m.players || []; this.st = 'lobby'; this.round = this.reveal = this.over = null; this.score = 0; break;
      case 'starting': this.st = 'starting'; this.score = 0; break;
      case 'round':
        this.round = m; this.reveal = null; this.given = m.given || ''; this.score = m.score || 0; this.countEnd = 0;
        this.st = m.done ? 'answered' : 'round';
        if (m.open) this.openUntil = Date.now() + m.left;
        break;
      case 'open':
        if (this.round && this.round.i === m.i) { this.round.open = true; this.openUntil = Date.now() + m.left; try { navigator.vibrate?.(60); } catch { } }
        break;
      case 'countdown': if (this.round && this.round.i === m.i) this.countEnd = Date.now() + m.n * 1000; break;
      case 'got': this.st = 'answered'; break;
      case 'reveal': this.reveal = m; this.score = m.you.score; this.st = 'reveal'; try { navigator.vibrate?.(m.you.ok ? [40, 60, 40] : 200); } catch { } break;
      case 'over': this.over = m; this.score = m.you.score; this.st = 'over'; break;
      case 'closed': this.st = 'join'; this.err = 'Der Host hat die Lobby geschlossen.'; this.conn = null; break;
      case 'full': this.st = 'join'; this.err = 'Das Spiel ist voll.'; this.conn = null; break;
      default: return;
    }
    renderPlayer();
  },
  answer(idx, text) {
    if (this.st !== 'round' || !this.round?.open) return;
    this.given = text != null ? text : (this.round.opts?.[idx]?.label || '');
    try { this.conn?.send({ t: 'answer', i: this.round.i, idx, text }); } catch { }
    this.st = 'answered'; renderPlayer();
  }
};

      if (P.st === 'answered') return top + head + `<div class="card pl-center"><div class="check">✓</div><b>Antwort abgegeben</b><div class="muted" style="margin-top:6px">${esc(P.given)}</div><p class="small muted">Warte auf die anderen …</p></div>`;

    state.view = 'lobby'; render();
    keepAwake();
    if (S.output === 'browser' && !isMobile() && Out.status === 'idle') Out.initBrowser().catch(() => { });
    loadTracks(S.playlist).catch(() => { });
    if (MP.status !== 'ready') { try { await MP.open(); } catch { } if (state.view === 'lobby') render(); }
    else MP.broadcast(() => mpLobbyMsg());
    ensureQr();
  },
  closeLobby() { MP.close(); G = null; state.view = 'home'; render(); },
  mpStart() { startGame(true); },
  mpRevealNow() { mpReveal(); },
  mpLobby() { G = null; state.view = 'lobby'; render(); ensureQr(); MP.broadcast(() => mpLobbyMsg()); },
  plJoin() {
    const code = ($('#plCode')?.value || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 5);
    const name = ($('#plName')?.value || '').replace(/\s+/g, ' ').trim().slice(0, 20);
    if (code.length !== 5) return toast('Der Code hat 5 Zeichen.');
    if (!name) return toast('Bitte gib deinen Namen ein.');
    PL.code = code; PL.name = name; store.set('plname', name);
    try { history.replaceState(null, '', REDIRECT_URI + '?join=' + code); } catch { }
    PL.st = 'connecting'; PL.err = ''; PL.retry = 0; renderPlayer();
    PL.connect().catch(e => PL.fail(e));
  },
  plCancel() { const c = PL.conn; PL.conn = null; PL.st = 'join'; try { c?.close(); } catch { } renderPlayer(); },
  plAns(el) { PL.answer(+el.dataset.k); },
  clearBoard() {
    if (!state.confirmClear) { state.confirmClear = true; render(); return; }
    store.set('board', []); state.confirmClear = false; render(); toast('Bestenliste geleert.');
  }
};
function rerenderKeepScroll() { const y = window.scrollY; render(); window.scrollTo(0, y); }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = actions[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('submit', e => {
  if (e.target.id === 'freeForm') { e.preventDefault(); const v = ($('#freeIn')?.value || '').trim(); if (v) submitAnswer(null, v); }
  if (e.target.id === 'plFree') { e.preventDefault(); const v = ($('#plFreeIn')?.value || '').trim(); if (v) PL.answer(null, v); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'plFilter') { state.plFilter = e.target.value; $('#plList').innerHTML = plListHtml(); }
  if (e.target.id === 'vol') { S.volume = +e.target.value; $('#volTxt').textContent = Math.round(S.volume * 100) + ' %'; Out.setVolume(S.volume); saveSettings(); }
  if (e.target.id === 'pname') { S.name = e.target.value; saveSettings(); }
});
document.addEventListener('keydown', e => {
  if (state.view !== 'game' || !G?.cur) return;
  const typing = e.target.tagName === 'INPUT';
  if (!typing && /^[1-4]$/.test(e.key) && G.cur.opts) { e.preventDefault(); submitAnswer(+e.key - 1); }
  else if (!typing && e.key === ' ') { e.preventDefault(); actions.play(); }
  else if (e.key === 'Enter' && G.cur.answered) { e.preventDefault(); nextRound(); }
});
window.addEventListener('pagehide', () => { stopPlayback(); });

// ---------- Start ----------
async function enterHome() {
  state.view = 'loading'; state.loadingText = 'Lade deine Playlists …'; render();
  try {
    if (!state.me) state.me = await api('/me');
    const [pls, liked] = await Promise.all([loadPlaylists(), api('/me/tracks?limit=1').then(j => j?.total ?? null).catch(() => null)]);
    state.playlists = pls; state.liked = liked;
    if (state.me?.country) store.set('country', state.me.country);
    state.view = 'home'; render();
  } catch (e) {
    console.error(e);
    if (e.status === 401) { Auth.logout(); state.error = 'Bitte melde dich erneut an.'; }
    else if (e.status === 403) state.error = 'Spotify verweigert den Zugriff (403). Prüfe im Developer-Dashboard: Ist dein Konto unter „User Management“ eingetragen, hast du Premium, und ist „Web API“ aktiviert?';
    else state.error = e.message || String(e);
    state.view = 'login'; render();
  }
}
async function boot() {
  const p = new URLSearchParams(location.search);
  if (p.has('join')) { // Mitspieler-Modus: kein Spotify nötig
    PL.code = (p.get('join') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 5);
    state.view = 'player'; return render();
  }
  if (p.has('code') || p.has('error')) {
    state.view = 'loading'; state.loadingText = 'Anmeldung …'; render();
    try { await Auth.handleCallback(); } catch (e) { state.error = e.message; }
  }
  if (!Auth.clientId) { state.view = 'setup'; return render(); }
  if (!Auth.token) { state.view = 'login'; return render(); }
  await enterHome();
}
boot();
</script>
