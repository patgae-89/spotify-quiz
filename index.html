<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0c0a12">
<title>Snippet – Das Musik-Quiz für deine Spotify-Playlists</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0a12; --panel:#15121e; --panel2:#1d1929; --line:#2b2640; --line2:#3b3456;
  --text:#f4f1fb; --muted:#9a93ad; --pink:#ff3d81; --orange:#ff8a3d; --cyan:#3de0ff; --lime:#c8ff4d;
  --ok:#35d98a; --bad:#ff5a5a; --r:18px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Space Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:
  radial-gradient(1100px 600px at 0% -10%,rgba(255,61,129,.16),transparent 60%),
  radial-gradient(900px 520px at 110% 0%,rgba(61,224,255,.12),transparent 60%),var(--bg);background-attachment:fixed}
a{color:var(--cyan)}
a.btn{color:var(--text);text-decoration:none}
.wrap{max-width:880px;margin:0 auto;padding:20px 16px 90px}
.narrow{max-width:620px}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0}
input{font:inherit;color:var(--text)}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;background:#0b0911;border:1px solid var(--line);padding:3px 7px;border-radius:7px;word-break:break-all}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:22px;letter-spacing:-.03em}
.logo .mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--pink),var(--orange));display:grid;place-items:center;box-shadow:0 6px 24px rgba(255,61,129,.35)}
.logo .mark svg{width:18px;height:18px}
.logo small{font-weight:400;color:var(--muted);font-size:13px;letter-spacing:0}
.top .right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.who{font-size:13px;color:var(--muted)}

/* cards & controls */
.card{background:linear-gradient(180deg,rgba(255,255,255,.025),transparent),var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px}
.card h2{margin:0 0 14px;font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:8px}
.card h2 .n{width:22px;height:22px;border-radius:50%;background:var(--panel2);border:1px solid var(--line2);display:grid;place-items:center;font-size:11px;color:var(--text);letter-spacing:0}
h1{font-size:28px;letter-spacing:-.03em;margin:0 0 8px}
p{line-height:1.5}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--panel2);border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-weight:500;transition:border-color .15s,transform .1s,background .15s;white-space:nowrap}
.btn:hover{border-color:var(--line2)}
.btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(135deg,var(--pink),var(--orange));border:none;color:#fff;font-weight:700;box-shadow:0 8px 28px rgba(255,61,129,.28)}
.btn.ghost{background:transparent}
.btn.big{padding:16px 22px;font-size:18px;width:100%;border-radius:14px}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.field{width:100%;background:#0b0911;border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none}
.field:focus{border-color:var(--pink)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lbl{font-size:13px;color:var(--muted);margin:16px 0 8px}
.lbl:first-child{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);font-size:14px;transition:.15s}
.chip:hover{border-color:var(--line2)}
.chip.on{background:rgba(255,61,129,.14);border-color:var(--pink)}
.chip.dis{opacity:.35}
.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.preset{border:1px solid var(--line);background:var(--panel2);border-radius:14px;padding:12px;text-align:left;transition:.15s}
.preset b{display:block;font-size:15px;margin-bottom:3px}
.preset span{font-size:12px;color:var(--muted);line-height:1.35;display:block}
.preset.on{border-color:var(--pink);background:rgba(255,61,129,.1)}
@media (max-width:560px){.presets{grid-template-columns:1fr}}

/* playlists */
.pl-list{max-height:330px;overflow:auto;display:grid;gap:4px;margin-top:10px;padding-right:4px}
.pl{display:flex;align-items:center;gap:12px;padding:7px;border-radius:12px;border:1px solid transparent;text-align:left;width:100%}
.pl:hover{background:var(--panel2)}
.pl.on{border-color:var(--pink);background:rgba(255,61,129,.09)}
.pl.off{opacity:.38;cursor:default}
.pl.off:hover{background:none}
.pl .img{width:46px;height:46px;border-radius:9px;object-fit:cover;background:var(--panel2);flex:none;display:grid;place-items:center;font-size:20px}
.pl .meta{min-width:0;flex:1}
.pl .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.pl .sub{font-size:12px;color:var(--muted)}
.liked{background:linear-gradient(135deg,#5b3dff,#9e8bff)!important;color:#fff}
details.others{margin-top:8px}
details.others summary{cursor:pointer;color:var(--muted);font-size:13px;padding:6px 2px}

/* devices */
.dev{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);width:100%;text-align:left;margin-bottom:6px}
.dev.on{border-color:var(--pink);background:rgba(255,61,129,.1)}
.dev .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dev .dot.act{background:var(--ok);box-shadow:0 0 10px var(--ok)}
.status{font-size:13px;color:var(--muted);margin-top:10px;display:flex;gap:8px;align-items:center}
.status.ok{color:var(--ok)} .status.err{color:var(--bad)}

/* setup */
ol.steps{padding-left:20px;line-height:1.6;margin:14px 0}
ol.steps li{margin-bottom:12px}
.copy{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.warn{background:rgba(255,138,61,.1);border:1px solid rgba(255,138,61,.4);color:#ffd0b0;padding:10px 12px;border-radius:12px;font-size:14px;margin:12px 0;line-height:1.45}
.err-box{background:rgba(255,90,90,.1);border:1px solid rgba(255,90,90,.4);color:#ffc4c4;padding:10px 12px;border-radius:12px;font-size:14px;margin:12px 0;line-height:1.45}

/* game */
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}
.hud .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-size:14px}
.hud .stat b{font-size:18px;margin-left:4px}
.stage{position:relative;overflow:hidden;text-align:center;padding:26px 18px 22px}
.stage::before{content:"";position:absolute;inset:-40% -20% auto;height:260px;background:radial-gradient(closest-side,rgba(255,61,129,.18),transparent);pointer-events:none}
.ask{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:10px 0 4px;position:relative}
.fx{display:inline-flex;gap:8px;align-items:center;padding:6px 14px;border-radius:999px;font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;position:relative}
.fx-normal{background:rgba(255,255,255,.07);color:var(--text)}
.fx-fast{background:rgba(61,224,255,.14);color:var(--cyan)}
.fx-slow{background:rgba(200,255,77,.13);color:var(--lime)}
.fx-reverse{background:rgba(255,61,129,.16);color:var(--pink)}
.eq{display:flex;gap:5px;justify-content:center;align-items:flex-end;height:64px;margin:22px auto 16px;position:relative}
.eq i{width:7px;border-radius:4px;background:linear-gradient(180deg,var(--pink),var(--orange));height:8px;opacity:.35;transition:height .2s}
.eq.on i{opacity:1;animation:bounce .9s ease-in-out infinite}
.eq.on.fast i{animation-duration:.45s}
.eq.on.slow i{animation-duration:1.8s}
.eq.on.reverse i{animation-direction:reverse}
@keyframes bounce{0%,100%{height:10px}50%{height:var(--h,50px)}}
.prog{height:6px;border-radius:6px;background:var(--panel2);overflow:hidden;max-width:420px;margin:0 auto 18px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--pink));animation:fill linear forwards}
@keyframes fill{to{width:100%}}
.playbtn{width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--orange));display:inline-grid;place-items:center;box-shadow:0 10px 36px rgba(255,61,129,.4);transition:transform .12s}
.playbtn:hover{transform:scale(1.05)}
.playbtn svg{width:30px;height:30px;margin-left:4px}
.playbtn.spin{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.hint{font-size:13px;color:var(--muted);margin-top:10px;min-height:18px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.opts{grid-template-columns:1fr}}
.opt{padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);text-align:left;font-size:16px;font-weight:500;display:flex;gap:12px;align-items:center;transition:.15s;min-height:62px}
.opt:hover:not(:disabled){border-color:var(--pink)}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;border:1px solid var(--line2);display:grid;place-items:center;font-size:12px;color:var(--muted)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:rgba(53,217,138,.14)}
.opt.bad{border-color:var(--bad);background:rgba(255,90,90,.12)}
.opt.dim{opacity:.4}
.opts.covers{grid-template-columns:repeat(4,1fr)}
@media (max-width:620px){.opts.covers{grid-template-columns:1fr 1fr}}
.opt.cov{padding:6px;flex-direction:column;align-items:stretch;min-height:0}
.opt.cov img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block}
.opt.cov .k{position:absolute;margin:8px;background:rgba(0,0,0,.6)}
.opt.cov{position:relative}
.free{display:flex;gap:10px}
.free .field{font-size:17px}
.reveal{display:flex;gap:16px;align-items:center;margin-top:14px;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--panel2)}
.reveal.ok{border-color:rgba(53,217,138,.55)} .reveal.bad{border-color:rgba(255,90,90,.5)}
.reveal img{width:104px;height:104px;border-radius:12px;object-fit:cover;flex:none}
.reveal .v{font-weight:700;font-size:15px;margin-bottom:4px}
.reveal.ok .v{color:var(--ok)} .reveal.bad .v{color:var(--bad)}
.reveal .t{font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.reveal .a{color:var(--text);opacity:.85}
.reveal .al{color:var(--muted);font-size:14px}
.reveal .links{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.pts{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:8px;background:rgba(255,255,255,.08);font-size:13px;color:var(--text)}
@media (max-width:520px){.reveal{flex-direction:column;text-align:center}.reveal .links{justify-content:center}}

/* results & board */
.score-big{font-size:64px;font-weight:700;letter-spacing:-.04em;line-height:1;background:linear-gradient(135deg,var(--pink),var(--orange));-webkit-background-clip:text;background-clip:text;color:transparent}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.kpi b{display:block;font-size:22px}
.kpi span{font-size:12px;color:var(--muted)}
.rounds{display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.rrow{display:flex;gap:10px;align-items:center;padding:6px;border-radius:10px;background:var(--panel2)}
.rrow img{width:40px;height:40px;border-radius:7px;object-fit:cover}
.rrow .m{flex:1;min-width:0}
.rrow .m div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .m .s{font-size:12px;color:var(--muted)}
.rrow .p{font-weight:700;font-size:14px;min-width:54px;text-align:right}
.rrow .p.ok{color:var(--ok)} .rrow .p.bad{color:var(--bad)}
table.board{width:100%;border-collapse:collapse;font-size:14px}
table.board th{text-align:left;color:var(--muted);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.08em;padding:8px 6px;border-bottom:1px solid var(--line)}
table.board td{padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
table.board td.r{font-weight:700;width:38px;color:var(--muted)}
table.board tr.me td{background:rgba(255,61,129,.08)}
table.board .sc{font-weight:700}
.medal{font-size:16px}
.empty{text-align:center;color:var(--muted);padding:30px 10px}

/* misc */
.loading{text-align:center;padding:80px 20px}
.spinner{width:40px;height:40px;border-radius:50%;border:3px solid var(--line2);border-top-color:var(--pink);animation:rot 1s linear infinite;margin:0 auto 18px}
@keyframes rot{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#231e33;border:1px solid var(--line2);padding:12px 16px;border-radius:12px;max-width:min(92vw,520px);font-size:14px;line-height:1.45;opacity:0;pointer-events:none;transition:.25s;z-index:50;box-shadow:0 12px 40px rgba(0,0,0,.5)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.vol{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.vol input{accent-color:var(--pink);width:140px}
.foot{margin-top:28px;font-size:12px;color:var(--muted);text-align:center;line-height:1.6}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';

/* ================================================================
   Snippet – Musik-Quiz für Spotify
   Einzelne Datei, kein Server nötig. Login per OAuth PKCE.
   ================================================================ */

// ---------- Helpers ----------
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const store = {
  get(k, d) { try { const v = localStorage.getItem('snq_' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('snq_' + k, JSON.stringify(v)); } catch { } },
  del(k) { try { localStorage.removeItem('snq_' + k); } catch { } }
};
function isMobile() {
  return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}
let toastTimer;
function toast(msg, ms = 4200) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), ms);
}
function randStr(n) {
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';
  const v = crypto.getRandomValues(new Uint8Array(n));
  return Array.from(v, x => chars[x % chars.length]).join('');
}
async function pkceChallenge(verifier) {
  const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
  return btoa(String.fromCharCode(...new Uint8Array(d))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

// Text-Normalisierung für Vergleiche
function norm(s) {
  return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/ß/g, 'ss').replace(/&/g, ' and ').replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();
}
function cleanTitle(s) {
  const c = String(s || '')
    .replace(/\s*[\(\[][^\)\]]*[\)\]]/g, '')       // (Remastered 2011), [feat. X]
    .replace(/\s+-\s+.*$/, '')                     // - Radio Edit
    .replace(/\s+(feat\.?|ft\.?|featuring)\s.*$/i, '')
    .trim();
  return c || String(s || '');
}
function core(s) { return norm(cleanTitle(s)).replace(/^(the|die|der|das|le|la|el) /, ''); }
function lev(a, b) {
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, i) => i), cur = new Array(n + 1);
  for (let i = 1; i <= m; i++) {
    cur[0] = i;
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    [prev, cur] = [cur, prev];
  }
  return prev[n];
}
function sim(a, b) { if (!a || !b) return 0; if (a === b) return 1; return 1 - lev(a, b) / Math.max(a.length, b.length); }
function isMatch(input, target) {
  const a = core(input), b = core(target);
  if (!a || !b) return false;
  if (a === b || a.replace(/ /g, '') === b.replace(/ /g, '')) return true;
  if (b.length <= 3) return false;
  return sim(a, b) >= 0.8;
}

// ---------- Konstanten ----------
const REDIRECT_URI = location.origin + location.pathname;
const SCOPES = [
  'streaming', 'user-read-email', 'user-read-private',
  'playlist-read-private', 'playlist-read-collaborative', 'user-library-read',
  'user-read-playback-state', 'user-modify-playback-state'
].join(' ');
const Q_TYPES = {
  title: { label: 'Songtitel', ask: 'Wie heißt der Song?' },
  artist: { label: 'Interpret', ask: 'Wer ist der Interpret?' },
  album: { label: 'Albumname', ask: 'Von welchem Album ist das?' },
  cover: { label: 'Albumcover', ask: 'Welches Cover gehört dazu?' }
};
const EFFECTS = {
  normal: { label: 'Normal', icon: '▶' },
  fast: { label: 'Vorspulen', icon: '⏩' },
  slow: { label: 'Zeitlupe', icon: '🐢' },
  reverse: { label: 'Rückwärts', icon: '⏪' }
};
const PRESETS = {
  classic: { label: 'Klassisch', desc: 'Song raten, ganz normal abgespielt', q: ['title'], fx: ['normal'] },
  hacker: { label: 'Track Hacker', desc: 'Vorgespult, in Zeitlupe oder rückwärts', q: ['title'], fx: ['fast', 'slow', 'reverse'] },
  chaos: { label: 'Chaos-Mix', desc: 'Titel, Interpret, Album & Cover im Wechsel, alle Effekte', q: ['title', 'artist', 'album', 'cover'], fx: ['normal', 'fast', 'slow', 'reverse'] }
};
const DEFAULTS = { q: ['title'], fx: ['normal'], answer: 'mc', rounds: 10, secs: 10, output: isMobile() ? 'connect' : 'browser', deviceId: null, playlist: null, name: '', volume: 0.8 };
let S = Object.assign({}, DEFAULTS, store.get('settings', {}));
function saveSettings() { store.set('settings', S); }

// ---------- Auth (PKCE) ----------
const Auth = {
  get clientId() { return store.get('clientId', ''); },
  token: store.get('token', null),
  async login() {
    const verifier = randStr(64), state = randStr(16);
    store.set('pkce', { verifier, state });
    const challenge = await pkceChallenge(verifier);
    const q = new URLSearchParams({
      response_type: 'code', client_id: this.clientId, scope: SCOPES,
      code_challenge_method: 'S256', code_challenge: challenge, redirect_uri: REDIRECT_URI, state
    });
    location.href = 'https://accounts.spotify.com/authorize?' + q;
  },
  async handleCallback() {
    const p = new URLSearchParams(location.search);
    history.replaceState(null, '', REDIRECT_URI);
    if (p.get('error')) throw new Error(p.get('error') === 'access_denied' ? 'Anmeldung abgebrochen.' : 'Spotify-Fehler: ' + p.get('error'));
    const saved = store.get('pkce', null);
    if (!saved || saved.state !== p.get('state')) throw new Error('Anmeldung ungültig (state). Bitte nochmal versuchen.');
    const body = new URLSearchParams({
      grant_type: 'authorization_code', code: p.get('code'), redirect_uri: REDIRECT_URI,
      client_id: this.clientId, code_verifier: saved.verifier
    });
    const r = await fetch('https://accounts.spotify.com/api/token', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body });
    const j = await r.json().catch(() => ({}));
    store.del('pkce');
    if (!r.ok) throw new Error('Token-Fehler: ' + (j.error_description || j.error || r.status));
    this.save(j);
  },
  save(j) {
    this.token = { access: j.access_token, refresh: j.refresh_token || this.token?.refresh, exp: Date.now() + ((j.expires_in || 3600) - 60) * 1000 };

  const hist = store.get('poshist', {});

  const free = [...Array(B).keys()].filter(b => !used.includes(b));
  const bucket = pick(free.length ? free : [...Array(B).keys()]);

}

    G.phase = 'ready';
    state.view = 'game'; render();
  } catch (e) {
    console.error(e);
    state.view = 'home'; render();
    toast(e.message || String(e), 6000);
  }
}

function onSnippetStart(dur) {
  const c = G?.cur; if (!c) return;
  if (!c.startedAt) c.startedAt = performance.now();
  G.playDur = dur;
  G.phase = c.answered ? 'answered' : 'playing';
  renderGame();
}
function onSnippetEnd() {
  if (!G?.cur) return;
  if (G.phase === 'playing') { G.phase = 'listened'; renderGame(); }
}
async function playSnippet() {
  const c = G?.cur; if (!c || G.phase === 'starting') return;
  Preview.unlock(); Out.activate();
  c.plays++;
  G.phase = 'starting'; renderGame();
  try {
    if (c.fx === 'normal') await Out.playTrack(c.track, c.posMs, G.secs, onSnippetStart, onSnippetEnd);
    else await Preview.play(c.audio, c, G.secs, onSnippetStart, onSnippetEnd);
  } catch (e) {
    console.error(e);
    toast(e.message || 'Wiedergabe fehlgeschlagen.', 6000);
    if (G?.cur === c) { G.phase = c.answered ? 'answered' : (c.startedAt ? 'listened' : 'ready'); renderGame(); }
  }
}
function submitAnswer(idx, text) {
  const c = G?.cur; if (!c || c.answered || !c.startedAt) return;
  c.answered = true;
  const elapsed = (performance.now() - c.startedAt) / 1000;
  let ok;
  if (text != null) {
    c.given = text;
    ok = c.qType === 'artist' ? c.track.artists.some(a => isMatch(text, a)) : isMatch(text, correctLabel(c.track, c.qType));
  } else { c.pick = idx; ok = !!c.opts[idx]?.ok; }
  let pts = 0;
  if (ok) {
    G.streak++; G.correct++; G.bestStreak = Math.max(G.bestStreak, G.streak);
    const base = (G.answer === 'text' && c.qType !== 'cover') ? 150 : 100;
    const speed = Math.round(100 * Math.max(0, 1 - elapsed / (G.secs + 10)));
    const fxB = c.fx !== 'normal' ? 25 : 0;
    const streakB = Math.min(50, (G.streak - 1) * 10);
    pts = base + speed + fxB + streakB;
  } else G.streak = 0;
  c.ok = ok; c.pts = pts; G.score += pts;
  G.log.push({ name: c.track.name, artist: c.track.artists.join(', '), cover: c.track.coverSmall, ok, pts, q: c.qType, fx: c.fx });
  stopPlayback();
  G.phase = 'answered';
  renderGame();
}
async function nextRound() {
  Preview.unlock(); Out.activate();
  await stopPlayback();
  if (G.i + 1 >= G.rounds) return finishGame();
  const g = G;
  G.i++; G.phase = 'loading'; G.cur = null; renderGame();
  const c = await (G.nextP || prepareRound().catch(() => null));
  if (G !== g) return; // zwischendurch beendet
  G.nextP = null;
  if (!c) return finishGame();
  G.cur = c; G.phase = 'ready';
  kickPrefetch();
  renderGame();
  playSnippet();
}
function finishGame() {
  stopPlayback();
  const entry = { id: randStr(10), name: (S.name || 'Anonym').slice(0, 24), score: G.score, correct: G.correct, rounds: G.log.length, mode: G.modeLabel, playlist: G.plName, date: Date.now() };
  const board = store.get('board', []);
  board.push(entry); board.sort((a, b) => b.score - a.score);
  store.set('board', board.slice(0, 300));
  state.lastEntryId = entry.id;
  G.phase = 'over';
  state.view = 'result'; render();
}
function quitGame() { stopPlayback(); G = null; state.view = 'home'; render(); }

          <div class="al">${esc(t.album)}</div>
          ${c.given != null && !c.ok ? `<div class="al">Deine Antwort: ${esc(c.given || '–')}</div>` : ''}
          <div class="links"><button class="btn sm" data-act="listenNormal">▶ Original anhören</button><a class="btn sm" href="https://open.spotify.com/track/${esc(t.id)}" target="_blank" rel="noopener">In Spotify öffnen</a></div>
        </div></div>
      <div style="height:14px"></div>
      <button class="btn primary big" data-act="next">${last ? 'Ergebnis anzeigen' : 'Weiter →'}</button>`;
  }
  return hud + stage + answers + reveal;
}
function renderGame() {
  if (state.view !== 'game') return;
  const root = $('#gameRoot');
  if (!root) return render();
  const hadFocus = document.activeElement?.id === 'freeIn';
  const val = $('#freeIn')?.value || '';
  root.innerHTML = gameHtml();
  const fi = $('#freeIn');
  if (fi) { fi.value = val; if (hadFocus || !fi.disabled) fi.focus({ preventScroll: true }); }
}

function render() {
  const v = views[state.view] || views.boot;
  $('#app').innerHTML = v();
  if (state.view === 'home') {
    if (S.output === 'browser' && !isMobile() && Out.status === 'idle') Out.initBrowser().catch(() => { });
    if (S.output === 'connect' && state.devices == null) refreshDevices();
  }
  if (state.view === 'setup') $('#cid')?.focus();
}

async function refreshDevices() {
  try {
    const j = await api('/me/player/devices');
    state.devices = (j?.devices || []).filter(d => !d.is_restricted && d.id);
    if (!S.deviceId || !state.devices.some(d => d.id === S.deviceId)) {
      const act = state.devices.find(d => d.is_active) || state.devices[0];
      if (act) { S.deviceId = act.id; saveSettings(); }
    }
  } catch (e) { state.devices = []; toast(e.message); }
  updateOutputStatus();
}

// ---------- Aktionen ----------
const actions = {
  copyUri() { navigator.clipboard?.writeText(REDIRECT_URI).then(() => toast('Kopiert!'), () => toast('Bitte manuell kopieren.')); },
  saveCid() {
    const v = ($('#cid')?.value || '').trim();
    if (!/^[0-9a-f]{32}$/i.test(v)) return toast('Das sieht nicht nach einer Client ID aus (32 Zeichen, 0–9 und a–f).');
    store.set('clientId', v); Auth.logout();
    Auth.login().catch(e => toast(e.message));
  },
  editCid() { state.view = 'setup'; render(); },
  login() { state.error = ''; Auth.login().catch(e => toast(e.message)); },
  logout() { stopPlayback(); try { Out.player?.disconnect(); } catch { } Out.player = null; Out.initP = null; Out.status = 'idle'; Auth.logout(); state.me = null; state.playlists = null; state.trackCache = {}; state.view = 'login'; render(); },
  pickPl(el) { S.playlist = el.dataset.k; saveSettings(); $('#plList').innerHTML = plListHtml(); },
  preset(el) { const p = PRESETS[el.dataset.k]; S.q = p.q.slice(); S.fx = p.fx.slice(); saveSettings(); rerenderKeepScroll(); },
  toggleQ(el) { const k = el.dataset.k; S.q = S.q.includes(k) ? S.q.filter(x => x !== k) : [...S.q, k]; saveSettings(); rerenderKeepScroll(); },
  toggleFx(el) { const k = el.dataset.k; S.fx = S.fx.includes(k) ? S.fx.filter(x => x !== k) : [...S.fx, k]; saveSettings(); rerenderKeepScroll(); },
  answer(el) { S.answer = el.dataset.k; saveSettings(); rerenderKeepScroll(); },
  rounds(el) { S.rounds = +el.dataset.k; saveSettings(); rerenderKeepScroll(); },
  secs(el) { S.secs = +el.dataset.k; saveSettings(); rerenderKeepScroll(); },
  output(el) { S.output = el.dataset.k; saveSettings(); rerenderKeepScroll(); },
  retryBrowser() { Out.status = 'idle'; Out.initP = null; Out.initBrowser().catch(() => { }); updateOutputStatus(); },
  pickDev(el) { S.deviceId = el.dataset.k; saveSettings(); updateOutputStatus(); },
  refreshDevs() { state.devices = null; updateOutputStatus(); refreshDevices(); },
  start() { S.name = ($('#pname')?.value || '').trim(); saveSettings(); startGame(); },
  play() { if (G?.phase !== 'starting' && G?.phase !== 'playing') playSnippet(); },
  ans(el) { submitAnswer(+el.dataset.k); },
  giveUp() { submitAnswer(null, ''); },
  next() { nextRound(); },
  listenNormal() {
    const c = G?.cur; if (!c) return;
    Out.activate();
    Out.playTrack(c.track, c.posMs, 15, null, null).catch(e => toast(e.message));
  },
  quit() { quitGame(); },
  again() { state.view = 'home'; startGame(); },
  home() { stopPlayback(); state.view = 'home'; state.confirmClear = false; render(); },
  board() { stopPlayback(); state.confirmClear = false; state.view = 'board'; render(); },
  boardFilter(el) { state.boardFilter = el.dataset.k; render(); },
  clearBoard() {
    if (!state.confirmClear) { state.confirmClear = true; render(); return; }
    store.set('board', []); state.confirmClear = false; render(); toast('Bestenliste geleert.');
  }
};
function rerenderKeepScroll() { const y = window.scrollY; render(); window.scrollTo(0, y); }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = actions[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('submit', e => {
  if (e.target.id === 'freeForm') { e.preventDefault(); const v = ($('#freeIn')?.value || '').trim(); if (v) submitAnswer(null, v); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'plFilter') { state.plFilter = e.target.value; $('#plList').innerHTML = plListHtml(); }
  if (e.target.id === 'vol') { S.volume = +e.target.value; $('#volTxt').textContent = Math.round(S.volume * 100) + ' %'; Out.setVolume(S.volume); saveSettings(); }
  if (e.target.id === 'pname') { S.name = e.target.value; saveSettings(); }
});
document.addEventListener('keydown', e => {
  if (state.view !== 'game' || !G?.cur) return;
  const typing = e.target.tagName === 'INPUT';
  if (!typing && /^[1-4]$/.test(e.key) && G.cur.opts) { e.preventDefault(); submitAnswer(+e.key - 1); }
  else if (!typing && e.key === ' ') { e.preventDefault(); actions.play(); }
  else if (e.key === 'Enter' && G.cur.answered) { e.preventDefault(); nextRound(); }
});
window.addEventListener('pagehide', () => { stopPlayback(); });

// ---------- Start ----------
async function enterHome() {
  state.view = 'loading'; state.loadingText = 'Lade deine Playlists …'; render();
  try {
    if (!state.me) state.me = await api('/me');
    const [pls, liked] = await Promise.all([loadPlaylists(), api('/me/tracks?limit=1').then(j => j?.total ?? null).catch(() => null)]);
    state.playlists = pls; state.liked = liked;
    if (state.me?.country) store.set('country', state.me.country);
    state.view = 'home'; render();
  } catch (e) {
    console.error(e);
    if (e.status === 401) { Auth.logout(); state.error = 'Bitte melde dich erneut an.'; }
    else if (e.status === 403) state.error = 'Spotify verweigert den Zugriff (403). Prüfe im Developer-Dashboard: Ist dein Konto unter „User Management“ eingetragen, hast du Premium, und ist „Web API“ aktiviert?';
    else state.error = e.message || String(e);
    state.view = 'login'; render();
  }
}
async function boot() {
  const p = new URLSearchParams(location.search);
  if (p.has('code') || p.has('error')) {
    state.view = 'loading'; state.loadingText = 'Anmeldung …'; render();
    try { await Auth.handleCallback(); } catch (e) { state.error = e.message; }
  }
  if (!Auth.clientId) { state.view = 'setup'; return render(); }
  if (!Auth.token) { state.view = 'login'; return render(); }
  await enterHome();
}
boot();
</script>
